# DRAUPNE Link settings. Copy to draupne-link.properties (or run: gradlew run --args="init-config")
# and edit. Any key left out falls back to the value in this file.

# --- Network ---
# linkMode:
#   phone - connect straight to the phone (Flight app "Direct connection"). When the phone is on 4G it has no
#           reachable IP, so put both phone and PC on a VPN (Tailscale or ZeroTier) and use the phone's VPN IP.
#   relay - connect to an upstream DroidDrone relay server with a public IP (Flight app "Connect over server").
#   host  - run the relay inside this app; the phone connects to this home's public IP.
#           Needs UDP <port> forwarded on the router to this PC, and a public (non-CGNAT) IPv4.
linkMode=phone
# Address of the phone (phone mode) or relay server (relay mode). Not used in host mode.
ip=
port=6286
# Must match the key set in the Flight app (and on the relay server). At most 16 characters.
key=DD

# --- Radio (RadioMaster TX16S in EdgeTX "USB Joystick (HID)" mode) ---
# Part of the joystick name to pick; empty = first joystick found. See: gradlew run --args="list"
joystick=
# How often the radio is read and an RC frame sent (Hz), both in the same tick. Higher = less delay.
# 250 Hz adds at most 4 ms; upstream's phone app uses 25 Hz (40 ms). Allowed: 10..250.
rcRate=250

# Channel mapping. DroidDrone sends channels in AETR order, then AUX1..AUX14:
#   roll (A), pitch (E), yaw (R), throttle (T), aux1, aux2, ...
# The Flight app re-orders them to your Betaflight channel map automatically.
# Source syntax: axisN | buttonN | a fixed value 1000..2000. Prefix "-" to invert (e.g. -axis1).
# EdgeTX classic joystick mode: radio CH1..CH8 -> axis0..axis7, CH9+ -> button0+.
# Defaults assume the radio model outputs AETR (CH1 Ail, CH2 Ele, CH3 Thr, CH4 Rud).
# Check with: gradlew run --args="monitor"
roll=axis0
pitch=axis1
yaw=axis3
throttle=axis2
aux1=axis4
aux2=axis5
aux3=axis6
aux4=axis7

# --- Drone setup ---
# The flight mode switch Drone setup writes to Betaflight's Modes: AUX channel, then the modes for the switch's low,
# middle and high position (ACRO, ANGLE, POS_HOLD = GPS position hold, GPS_RESCUE). off = leave Betaflight's modes.
# A GPS mode turns Betaflight's GPS on, and is only written once the GPS answers (no fix needed) and Betaflight is new
# enough: GPS rescue 4.4, GPS position hold 2025.12.
drone.modeSwitch=2:ACRO,ANGLE,POS_HOLD
# GPS rescue on its own switch too (up = rescue): the AUX number, or off. Only fitted when Betaflight's failsafe
# (stage 2) is already GPS rescue - Drone setup never changes the failsafe.
drone.rescueSwitch=4

# --- Video ---
# video=false turns the camera stream off (RC only).
video=true
# hevc (H.265) needs fewer bits for the same picture -> less time on the 4G link. avc (H.264) if the phone struggles.
videoCodec=hevc

# --- Spectators (phone mode) ---
# A second PC that connects while this one flies is told so by the phone (DRAUPNE Flight 2.3.0-pc.11 and on) and
# watches through this PC: video, OSD and recording, no sticks. It uses this PC's upload, about as much as the video.
# Off by default: SETTINGS > Allow spectators (true) lets up to 2 PCs watch.
allowSpectators=false
# On a spectator PC: how far behind the pilot its picture runs (ms, 200..5000). The time goes on asking for lost
# packets again and evening out the network, for a clean, steady picture. More = smoother.
spectatorDelayMs=600

# --- Values sent to the Flight app in its Config packet ---
# How often the phone reads the FC for the OSD (Hz): 20 = the horizon lags at most 50 ms. Each read is an MSP
# message to the FC: set serial_update_rate_hz = 2000 in the Betaflight CLI, or the RC frames queue up behind them.
telemetryRate=20
# FC serial baud rate; ignored when the phone uses the FC's USB port.
serialBaudRate=115200
cameraId=0
cameraWidth=1280
cameraHeight=720
# Camera frame rate (SETTINGS > Camera frame rate). min = max is a steady rate: 60/60 moves smoothly; in dim light
# 30-60 lets the camera drop to 30 for a brighter picture, and the switching looks jumpy. A steady rate needs phone
# app 2.3.0-pc.12 (it picks the camera's nearest supported range); an older one gets 30-60.
cameraFpsMin=60
cameraFpsMax=60
bitrateLimitMbps=6
