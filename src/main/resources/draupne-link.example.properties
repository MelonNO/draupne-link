# DRAUPNE Link settings. Copy to draupne-link.properties (or run: gradlew run --args="init-config")
# and edit. Any key left out falls back to the value in this file.

# --- Network ---
# The PC connects straight to the phone over Tailscale (both on the same Tailscale account). Since 1.0.35 every
# device has a DRAUPNE name - phones MobileAlpha, MobileBravo ..., PCs PCAlpha, PCBravo ... - and the pilot picks
# the phone by name on the LINK card; MENU > LINK > Name map lists every device seen with its address.
# This PC's own name: given by itself (the first PC letter it has not seen); change it in the name map.
pcName=
# The phone chosen on the LINK card, by name; ip is its address as last seen (the name map keeps it up to date).
phoneName=
ip=
port=6286
# Must match the key in the Flight app (Advanced on the phone). At most 16 characters.
key=DD

# --- Radio (RadioMaster TX16S in EdgeTX "USB Joystick (HID)" mode) ---
# Part of the joystick name to pick; empty = first joystick found. See: gradlew run --args="list"
joystick=
# How often the radio is read and an RC frame sent (Hz), both in the same tick. Higher = less delay.
# 250 Hz adds at most 4 ms; upstream's phone app uses 25 Hz (40 ms). Allowed: 10..250.
rcRate=250

# Channel mapping. DroidDrone sends channels in AETR order, then AUX1..AUX14:
#   roll (A), pitch (E), yaw (R), throttle (T), aux1, aux2, ...
# The Flight app re-orders them to your Betaflight channel map automatically.
# Source syntax: axisN | buttonN | a fixed value 1000..2000. Prefix "-" to invert (e.g. -axis1).
# EdgeTX classic joystick mode: radio CH1..CH8 -> axis0..axis7, CH9+ -> button0+.
# Defaults assume the radio model outputs AETR (CH1 Ail, CH2 Ele, CH3 Thr, CH4 Rud).
# Check with: gradlew run --args="monitor"
roll=axis0
pitch=axis1
yaw=axis3
throttle=axis2
aux1=axis4
aux2=axis5
aux3=axis6
aux4=axis7

# --- Drone setup ---
# The flight mode switch Drone setup writes to Betaflight's Modes: AUX channel, then the modes for the switch's low,
# middle and high position (ACRO, ANGLE, POS_HOLD = GPS position hold, GPS_RESCUE). off = leave Betaflight's modes.
# A GPS mode turns Betaflight's GPS on, and is only written once the GPS answers (no fix needed) and Betaflight is new
# enough: GPS rescue 4.4, GPS position hold 2025.12.
drone.modeSwitch=2:ACRO,ANGLE,POS_HOLD
# GPS rescue on its own switch too (up = rescue): the AUX number, or off. Only fitted when Betaflight's failsafe
# (stage 2) is already GPS rescue - Drone setup never changes the failsafe.
drone.rescueSwitch=4
# The ARM switch (up = armed) and the PREARM switch (up = prearm; with one set, Betaflight arms only while it is on,
# so a knocked ARM switch alone does nothing): the AUX number, or off = leave as it is in Betaflight.
drone.armAux=1
drone.prearmAux=3

# --- Video ---
# video=false turns the camera stream off (RC only).
video=true
# hevc (H.265) needs fewer bits for the same picture -> less time on the 4G link. avc (H.264) if the phone struggles.
videoCodec=hevc

# Video (SETTINGS > Video): auto = bad coverage mode comes on by itself on a weak link (640x360, up to 1 Mbit/s, key
# frames sent twice - softer but sturdier; phone app 2.3.0-pc.15 for the key frames), sharp = never, robust = always.
videoMode=auto

# --- Spectators (phone mode) ---
# Connect as: pilot (fly; if another PC flies already, this one is told so and only watches) or spectator (watch
# only: never asks to fly, waits when nobody flies). Chosen next to CONNECT.
connectAs=pilot
# A second PC that connects while this one flies is told so by the phone (DRAUPNE Flight 2.3.0-pc.11 and on) and
# watches through this PC: video, OSD and recording, no sticks. It uses this PC's upload, about as much as the video.
# Off by default: SETTINGS > Allow spectators (true) lets up to 2 PCs watch.
allowSpectators=false
# On a spectator PC: how far behind the pilot its picture runs (ms, 200..5000). The time goes on asking for lost
# packets again and evening out the network, for a clean, steady picture. More = smoother.
spectatorDelayMs=600

# --- Map (MENU > MAP) ---
# The map opens in a window of its own (Map window, F3), for a second screen; it remembers where it was (mapWindow).
# It shows where the drone is and has been; every flight's path is saved as a GPX file in Documents\DRAUPNE Link\Tracks,
# with last-position.txt. Map tiles are kept for good in %APPDATA%\DraupneLink\tiles, and the levels under a place
# looked at are fetched too, so the area works without internet later (not OpenStreetMap: its policy forbids that).
# The map picture: auto (Kartverket's topo map in Norway, OpenStreetMap elsewhere), kartverket, kartverket-raster
# (the printed map), satellite, osm.
mapSource=auto
# How positions are written: mgrs (the military grid), utm, decimal, dms.
coordinateFormat=mgrs
# Where the position comes from: drone (its GPS through the flight controller) or phone (the phone's own GPS, phone
# app 2.3.0-pc.16 with location allowed). The other fills in when the chosen one gives nothing for 5 s.
gpsSource=drone
# The map window's place: x,y,width,height (set by the program).
mapWindow=

# --- Window ---
# The controller card (sticks and channel bars) starts folded: EXPAND shows it. The choice is remembered.
controllerMinimized=true

# --- Values sent to the Flight app in its Config packet ---
# How often the phone reads the FC for the OSD (Hz): 20 = the horizon lags at most 50 ms. Each read is an MSP
# message to the FC: set serial_update_rate_hz = 2000 in the Betaflight CLI, or the RC frames queue up behind them.
telemetryRate=20
# FC serial baud rate; ignored when the phone uses the FC's USB port.
serialBaudRate=115200
cameraId=0
cameraWidth=1280
cameraHeight=720
# The camera always runs at a steady 30 fps (no setting).
# Top video bitrate (Mbit/s). 4 gives 720p at 30 fps nearly the same picture as 6, with more headroom before a
# weak 4G uplink queues up (delay of seconds). The PC lowers it by itself when the link struggles.
bitrateLimitMbps=4
# The sharp tier (MENU > VIDEO > Video: AUTO goes there after 20 s calm at the top bitrate and leaves it at the first
# stall; SHARP is always there): the picture size and top bitrate for a link that carries them. The phone takes the
# nearest size it has. The same values as cameraWidth / cameraHeight / bitrateLimitMbps mean no sharp tier.
sharpWidth=1920
sharpHeight=1080
sharpBitrateLimitMbps=8

# --- STANAG 4609 (MENU > LINK) and the camera's view (MENU > VIDEO) ---
# The stream: video + MISB ST 0601 metadata in an MPEG transport stream, over UDP to host:port (off by default).
stanag.enabled=false
stanag.target=127.0.0.1:15000
stanag.missionId=
# The security marking's country (ISO 3166, three letters); the stream is always marked UNCLASSIFIED.
stanag.country=NOR
# The camera: its angle across the picture and its tilt up on the frame (degrees), for its view on the map and the stream.
camera.hfovDeg=70
camera.tiltDeg=0
camera.viewOnMap=true
