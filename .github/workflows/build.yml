name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test
        run: .\gradlew.bat --no-daemon test
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: build/reports/tests/test

  # The phone app: built here only to check it compiles (signed with a throwaway key, never published). Releases are
  # built and signed off CI with the real key (flight-app/build.ps1).
  phone-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK parts the app needs
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          "y`n" * 20 | & $sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.3.11579264' | Out-Null
      - name: Build the phone app
        shell: pwsh
        run: |
          $env:JAVA17_HOME = $env:JAVA_HOME
          .\flight-app\build.ps1
