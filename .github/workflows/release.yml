name: Release

# Push a tag like v0.5.0 to build the installer and the portable zip and publish them, with the phone app, as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read # asking whether the Build workflow already tested this commit

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: WiX Toolset 3 (needed by jpackage for the installer)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          }
      - name: Check the tag matches the app version, and the phone app it ships matches the phone app source
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }} # through the environment: a tag name is never pasted into the script
        run: |
          $version = (Select-String -Path build.gradle -Pattern "^version = '(.+)'").Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match version $version in build.gradle" }
          $apk = [regex]::Match((Get-Content src/main/java/de/droiddrone/pc/setup/ApkShare.java -Raw), 'String VERSION = (?:bench\(\d+, )?"([^"]+)"').Groups[1].Value
          $phone = (Select-String -Path flight-app/overlay/Flight/build.gradle -Pattern 'versionName "([^"]+)"').Matches[0].Groups[1].Value
          if ($apk -ne $phone) { throw "ApkShare.VERSION is $apk but the phone app source is ${phone} - publish that phone app and pin it first" }
      # The Build workflow tested this very commit when it was pushed to its branch. The tests are left out here only
      # when a run of it for exactly this commit is completed and successful. No such run, one still going, one that
      # failed or was cancelled, or no answer to the question: the tests run here, as they always did.
      - name: Was this commit already tested by the Build workflow?
        id: tested
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $skip = 'false'
          try {
            $sha = "$(git rev-parse HEAD)".Trim()
            if ($sha -ne $env:GITHUB_SHA) { throw "the commit checked out ($sha) is not the one this run is for ($env:GITHUB_SHA)" }
            $json = gh run list --repo $env:GITHUB_REPOSITORY --workflow build.yml --event push --commit $sha --limit 20 --json 'databaseId,headSha,status,conclusion'
            if ($LASTEXITCODE -ne 0) { throw "gh run list ended with $LASTEXITCODE" }
            $green = @(($json | Out-String | ConvertFrom-Json) | Where-Object { $_.headSha -eq $sha -and $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
            if ($green.Count -gt 0) {
              $skip = 'true'
              Write-Host "Build run $($green[0].databaseId) passed for ${sha}: the tests are not run again"
            } else {
              Write-Host "No completed, successful Build run for ${sha} (found: $json): the tests run here"
            }
          } catch {
            Write-Host "Could not ask about the Build workflow ($_): the tests run here"
          }
          "skip=$skip" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Test, build installer and zip
        if: steps.tested.outputs.skip != 'true'
        run: .\gradlew.bat --no-daemon test releaseZip packageInstaller
      - name: Build installer and zip (the Build workflow tested this commit)
        if: steps.tested.outputs.skip == 'true'
        run: .\gradlew.bat --no-daemon releaseZip packageInstaller
      # The phone app is built and signed off CI (flight-app/build.ps1, key outside the repo) and stored in its own
      # flight-<version> release. Every PC release carries the exact build the PC app installs: the version and
      # SHA-256 pinned in ApkShare.java.
      - name: Phone app (the APK this PC version installs, checked against its pinned SHA-256)
        shell: pwsh
        run: |
          $src = Get-Content src/main/java/de/droiddrone/pc/setup/ApkShare.java -Raw
          # the pin may stand inside the bench's switch: bench(n, "...") (ApkShare)
          $version = [regex]::Match($src, 'String VERSION = (?:bench\(\d+, )?"([^"]+)"').Groups[1].Value
          $sha = [regex]::Match($src, 'APK_SHA256 = (?:bench\(\d+, )?"([0-9a-f]+)"').Groups[1].Value
          if (-not $version -or -not $sha) { throw 'VERSION / APK_SHA256 not found in ApkShare.java' }
          $name = "DRAUPNE-Flight-$version.apk"
          New-Item -ItemType Directory -Force build/release | Out-Null
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/flight-$version/$name" -OutFile "build/release/$name"
          $got = (Get-FileHash "build/release/$name" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "$name has SHA-256 $got, expected $sha" }
          Write-Host "$name OK ($sha)"
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: DRAUPNE Link ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            build/release/DRAUPNE-Link-Setup-*.exe
            build/release/DRAUPNE-Link-*-windows.zip
            build/release/DRAUPNE-Flight-*.apk
