# The test bench's real hardware (docs/TESTING.md, "Real hardware"): one phone on one drone, battery in, NO PROPELLERS.
#
# Copy this file to   %LOCALAPPDATA%\DraupneBench\hardware.properties   and put in this bench's own values.
# That copy stays on this PC: it is outside the repo and is never committed. Every value below is made up
# (192.0.2.x is an address kept for examples; nobody has it).
#
# Without that file no hardware scenario runs: each skips itself, and .\bench.ps1 hw says what is missing.

# --- The phone on the drone ---
# Its address as this PC reaches it on the way the run is to take - Wi-Fi, Tailscale or mobile data - written out
# as four numbers. No name: the bench's fence lets exactly this address and port through and nothing else.
phone.ip=192.0.2.10
# Its link port (DRAUPNE Flight's own is 6286). This PC's port of the same number must be free: no DRAUPNE Link open.
phone.port=6286
# The link key set in DRAUPNE Flight (Advanced on the phone). Left out: the app's own first key.
#phone.key=
# The way to the phone as Tailscale would tell the app: direct, or relay (the app then holds bad coverage mode, as it
# does on a relayed link). The app under test cannot ask the real Tailscale, so it is said here. Left out: direct.
#phone.path=direct
# The phone's serial as "adb devices" lists it (the phone runs: .\bench.ps1 phone).
phone.adb=EXAMPLE0SERIAL

# --- The flight controller and its battery ---
# The board's port on this PC, as the keeper opens it.
board.port=COM99
# The switch Betaflight arms on (AUX 1 .. 4; up = armed, as Drone setup writes it). The made-up radio's hands-off
# puts this one down and holds it there. Left out: 1.
#board.armAux=1
# The pack: how many cells, and the volts per cell under which nothing is armed and a run ends.
battery.cells=4
battery.cellFloor=3.5

# --- The keeper ---
# The keeper's control port on this PC's own loopback (127.0.0.1).
keeper.port=47800
