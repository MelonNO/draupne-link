# The test bench's real hardware (docs/TESTING.md, "Real hardware"): one phone on one drone, battery in, NO PROPELLERS.
#
# Copy this file to   %LOCALAPPDATA%\DraupneBench\hardware.properties   and put in this bench's own values.
# That copy stays on this PC: it is outside the repo and is never committed. Every value below is made up
# (192.0.2.x is an address kept for examples; nobody has it).
#
# Without that file no hardware scenario runs: each skips itself, and .\bench.ps1 hw says what is missing.

# --- The phone on the drone ---
# Its address as this PC reaches it on the way the run is to take - Wi-Fi, Tailscale or mobile data - written out
# as four numbers. No name: the bench's fence lets exactly this address and port through and nothing else.
phone.ip=192.0.2.10
# Its link port (DRAUPNE Flight's own is 6286). This PC's port of the same number must be free: no DRAUPNE Link open.
phone.port=6286
# The link key set in DRAUPNE Flight (Advanced on the phone). Left out: the app's own first key.
#phone.key=
# The way to the phone as Tailscale would tell the app: direct, or relay (the app then holds bad coverage mode, as it
# does on a relayed link). The app under test cannot ask the real Tailscale, so it is said here. Left out: direct.
#phone.path=direct
# The phone's serial as "adb devices" lists it (the phone runs: .\bench.ps1 phone).
phone.adb=EXAMPLE0SERIAL
# Which DRAUPNE Flight the phone runs fly - and may clear, stop and install over. Left out: the bench build
# (de.droiddrone.flight.pc.bench, flight-app\build.ps1 -Bench), which is the one to use. The released app's package
# (de.droiddrone.flight.pc) here means the phone runs fly the real app, and still change nothing of it unless a run
# is started with "the released app may be changed" - which is a run's own word and cannot be said in this file.
#phone.package=de.droiddrone.flight.pc.bench
#
# The phone's four (phone.adb, phone.ip, phone.port, phone.package) a run may also say itself: gradlew benchHwPhone
# -Pphone.adb=..., or the environment (BENCH_PHONE_ADB, BENCH_PHONE_IP, ...). Its word then goes before this file's.

# --- The flight controller and its battery ---
# The board's port on this PC, as the keeper opens it.
board.port=COM99
# The switch Betaflight arms on (AUX 1 .. 4; up = armed, as Drone setup writes it). The made-up radio's hands-off
# puts this one down and holds it there. Left out: 1.
#board.armAux=1
# This session may ARM the board: the battery is in, the propellers are OFF, and somebody decided it. Only then
# does a hardware scenario ask the keeper for an arm window (ten seconds, throttle at its minimum). Left out, or
# false - as on every other day - nothing is armed. Take the line out again when the session is over.
#board.mayArm=true
# The pack: how many cells, and the volts per cell under which nothing is armed and a run ends.
battery.cells=4
battery.cellFloor=3.5

# --- The keeper ---
# The flight controller keeper (gradlew fcKeeper; .\bench.ps1 hw starts and ends it) has the board's port for a whole
# run. Its control port on this PC's own loopback (127.0.0.1); the two ports after it are its too: the next for the
# phone app's flight controller (adb reverse leads it down the cable), the one after for the PC app's Drone setup.
# Left out: a bench with no flight controller on this PC - no keeper is started and nothing of a run is ever armed.
keeper.port=47800
# How many seconds the board may be armed in any one hour. Left out: 600.
#keeper.motorSeconds=600
