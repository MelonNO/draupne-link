plugins {
    id 'application'
    id 'org.gradle.test-retry' version '1.6.2' // quarantineTest's second and third try (off for the other test tasks)
}

// A second build folder (-PaltBuild=<folder>): for work beside a long bench run, whose app loads its classes from
// build/ as it goes - building there meanwhile would change the code under it.
if (project.hasProperty('altBuild')) layout.buildDirectory = file(project.property('altBuild'))

group = 'de.droiddrone.pc'
version = '1.0.71'

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.6'

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    runtimeOnly 'org.lwjgl:lwjgl::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-glfw::natives-windows'
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.google.zxing:core:3.5.3'   // QR codes in the phone guide
    implementation 'com.google.code.gson:gson:2.11.0' // parses `tailscale status --json`
    implementation 'com.fazecast:jSerialComm:2.11.0' // talks to Betaflight over USB in the setup wizard
    implementation 'org.bytedeco:ffmpeg:7.1-1.5.11'  // video decoding
    runtimeOnly 'org.bytedeco:ffmpeg:7.1-1.5.11:windows-x86_64'
    runtimeOnly 'org.bytedeco:javacpp:1.5.11:windows-x86_64'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Compile upstream's platform-neutral protocol code straight from the pinned submodule,
// so our wire format is the phone app's wire format. The four excluded Common files need Android;
// Server/src is upstream's relay, which we can host in-process (RelayHost). UdpSender, ReceiverBuffer and SavedPacket come
// from flight-app/overlay/Common instead: the same patched copies the phone app is built with (the resend timer
// that died after the first reconnect, see the files' headers).
sourceSets {
    main {
        java {
            srcDir 'upstream/Common/src/main/java'
            srcDir 'flight-app/overlay/Common/src/main/java'
            srcDir 'upstream/Server/src'
            exclude '**/server/Main.java'
            exclude '**/common/MediaCodecBuffer.java'
            exclude '**/common/MediaCommon.java'
            exclude '**/common/TelephonyService.java'
            exclude '**/common/Logcat.java'
            exclude { it.file.path.contains('upstream') && (it.name == 'UdpSender.java' || it.name == 'ReceiverBuffer.java' || it.name == 'SavedPacket.java') }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'de.droiddrone.pc.Main'
}

// the app shows its own version (window title, SETTINGS > About): AppInfo reads it from here
jar {
    manifest {
        attributes 'Implementation-Title': 'DRAUPNE Link', 'Implementation-Version': project.version
    }
}

run {
    standardInput = System.in
    workingDir = rootProject.projectDir
}

// ---------------------------------------------------------------------------------------------------------------------
// Tests: three tasks over the same test classes, told apart by JUnit tags.
//   gradlew test            -> all but the two tags below; test classes side by side in a few JVMs (forks)
//   gradlew perfTest        -> @Tag("perf"): what the code costs in time, one test at a time on a PC doing nothing else
//   gradlew quarantineTest  -> @Tag("quarantine"): tests known to fail now and then under load, each tried up to 3 times
// A tagged test is run by its own task only: `gradlew perfTest --tests PaintCostTest`, not `test --tests ...`.
// Tests of different classes run at the same time, so none may count on a fixed port or file (TestHygieneTest;
// de.droiddrone.testing.Ports and JUnit's @TempDir are the way).

tasks.withType(Test).configureEach {
    // upstream's relay (RelayHost) writes config.cfg into the working directory
    workingDir = layout.buildDirectory.dir('test-work').get().asFile
    doFirst { workingDir.mkdirs() }
    testLogging { // a failure on the release runner shows its message in the log, not only its line
        events 'failed'
        exceptionFormat = 'full'
    }
}

// The test bench's tags (docs/TESTING.md): run by the bench tasks further down, never by `test`.
def benchTags = ['benchself', 'explore', 'ui', 'badlink', 'edge', 'soak', 'night', 'emulator', 'sitl', 'finding']
// >>> R4, the hardware rig: its two tags are the bench's too - never run by `test`, perfTest, quarantineTest or CI
benchTags += ['hw', 'hwphone']
// <<< R4

test {
    useJUnitPlatform { excludeTags(*(['perf', 'quarantine'] + benchTags)) }
    // half the cores, 4 at most: the link and video tests each keep several threads busy and count real time
    maxParallelForks = Math.max(1, Math.min(4, Runtime.runtime.availableProcessors().intdiv(2)))
}

tasks.register('perfTest', Test) {
    group = 'verification'
    description = 'Runs the timing tests (@Tag("perf")), one at a time'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'perf' }
    maxParallelForks = 1
    mustRunAfter test // in one build: never while the other tests load the PC
}

tasks.register('quarantineTest', Test) {
    group = 'verification'
    description = 'Runs the tests known to fail now and then under load (@Tag("quarantine")), each up to 3 times'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'quarantine' }
    maxParallelForks = 1
    retry { maxRetries = 2 } // org.gradle.test-retry: a test that fails is run again, twice at most
    mustRunAfter test
}

// ---------------------------------------------------------------------------------------------------------------------
// The test bench (docs/TESTING.md; started by bench.ps1): the whole app run sealed off from this PC's real settings,
// flights, phones and internet, its buttons pressed, pictures taken.
//   gradlew benchSelf      -> @Tag("benchself"): the bench's own parts (the fence, the sandbox, the stand-ins)
//   gradlew benchUi        -> @Tag("ui"): the Windows app's scenarios, buttons pressed, every step photographed
//   gradlew benchLink      -> @Tag("badlink"): the bad-link table        gradlew benchEdge -> @Tag("edge"): edge cases
//   gradlew benchSoak      -> @Tag("soak"): long runs (BENCH_HOURS)      gradlew benchEmulator / benchSitl: see the doc
//   gradlew benchFindings  -> @Tag("finding"): the tests of bugs found and not fixed yet (they fail until fixed)
// One test class per JVM (the app's statics), one at a time. BENCH_ROOT = the run's folder (bench.ps1 sets it; kept).
def benchRootDir = file(System.getenv('BENCH_ROOT')
        ?: "${System.getenv('LOCALAPPDATA') ?: layout.buildDirectory.get().asFile}/DraupneBench/runs/dev")
def benchTask = { String taskName, String tagExpression, String what ->
    tasks.register(taskName, Test) {
        group = 'bench'
        description = what
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags tagExpression }
        // only the bench's own classes are handed out: with a JVM per class, every other test class would cost a JVM
        // start just to find that none of its tests carries the tag
        include '**/bench/**/*Scenario.class', '**/bench/**/*SelfTest.class'
        maxParallelForks = 1
        forkEvery = 1
        ignoreFailures = true // the run goes on: the report says what failed
        outputs.upToDateWhen { false }
        workingDir = new File(benchRootDir, 'work')
        doFirst {
            ['work', 'tmp', 'sealed/appdata', 'sealed/localappdata', 'sealed/home'].each { new File(benchRootDir, it).mkdirs() }
        }
        // the JVM starts sealed: no bench class has run yet, and the app's folders already point away from the pilot's;
        // each scenario then gets a user of its own under the run's folder (bench/Sandbox)
        environment 'APPDATA', new File(benchRootDir, 'sealed/appdata').path
        environment 'LOCALAPPDATA', new File(benchRootDir, 'sealed/localappdata').path
        systemProperty 'user.home', new File(benchRootDir, 'sealed/home').path
        systemProperty 'java.io.tmpdir', new File(benchRootDir, 'tmp').path
        environment 'TEMP', new File(benchRootDir, 'tmp').path // the JDK's own temporary files (its selectors' pipes) ask Windows, not Java
        environment 'TMP', new File(benchRootDir, 'tmp').path
        systemProperty 'bench.root', benchRootDir.path
        systemProperty 'bench.project', projectDir.path
        systemProperty 'bench.build', layout.buildDirectory.get().asFile.path
        systemProperty 'bench.realAppData', System.getenv('APPDATA') ?: ''        // read only: the armed guard
        systemProperty 'bench.realLocalAppData', System.getenv('LOCALAPPDATA') ?: '' // the Android SDK, the emulator
        systemProperty 'bench.mode', System.getenv('BENCH_MODE') ?: 'auto'        // desktop | quiet | auto
        systemProperty 'bench.hours', System.getenv('BENCH_HOURS') ?: '0.1'
        systemProperty 'bench.quick', System.getenv('BENCH_QUICK') ?: 'false'
        if (System.getenv('BENCH_SEED')) systemProperty 'bench.seed', System.getenv('BENCH_SEED')
        systemProperty 'java.security.manager', 'allow'                           // bench/Fence
        systemProperty 'bench.silentSound', 'true'                                // bench/SilentSound
        systemProperty 'javax.sound.sampled.SourceDataLine', 'de.droiddrone.bench.SilentSound'
        systemProperty 'org.bytedeco.javacpp.cachedir', "${System.getProperty('user.home')}/.javacpp/cache"
        systemProperty 'junit.jupiter.execution.timeout.default', System.getenv('BENCH_TIMEOUT') ?: '30 m'
        if (System.getenv('BENCH_SCALE')) systemProperty 'sun.java2d.uiScale', System.getenv('BENCH_SCALE')
        if (System.getenv('BENCH_SIZE')) systemProperty 'bench.size', System.getenv('BENCH_SIZE')
        maxHeapSize = '2g'
        reports.junitXml.outputLocation = new File(benchRootDir, "results/${taskName}")
        reports.html.outputLocation = new File(benchRootDir, "results/${taskName}-html")
        testLogging { events 'passed', 'failed', 'skipped' }
        mustRunAfter test
    }
}
benchTask('benchSelf', 'benchself', "The bench's own parts: the fence, the sandbox, the stand-ins")
benchTask('benchUi', 'ui & !finding', "The Windows app's scenarios: buttons pressed, every step photographed")
benchTask('benchLink', 'badlink & !finding', 'The bad-link table: each kind of bad network against each thing the pilot does')
benchTask('benchEdge', 'edge & !finding', 'Edge cases: kills, broken files, odd names, clocks, many phones')
benchTask('benchSoak', 'soak & !finding', 'Long runs (BENCH_HOURS): a fleet flying on bad links, watched for growth and loss')
benchTask('benchNight', 'night & !finding', 'The night: scenarios that take hours each (BENCH_HOURS) - one long flight, sleep and wake, the phone app left running')
benchTask('benchEmulator', 'emulator & !finding', 'The real phone app in the Android emulator against the Windows app')
benchTask('benchSitl', 'sitl & !finding', 'Real Betaflight firmware (SITL) answering the app')
benchTask('benchFindings', 'finding', 'The tests of bugs found and not fixed yet: each fails until its bug is fixed')
benchTask('benchExplore', 'explore', "For the bench's author: the app started and looked at, nothing checked")

// >>> R4, the hardware rig (docs/TESTING.md, "Real hardware") ---------------------------------------------------------
//   gradlew benchHw        -> @Tag("hw"): the Windows app, sealed off as ever, against this bench's one real phone
//   gradlew benchHwPhone   -> @Tag("hwphone"): the real phone itself
// As the bench tasks above (one test class per JVM, one at a time) with one thing more: -Dbench.hardware=true, without
// which the fence lets nothing out of this PC (bench/Fence.Reach). These two tasks set it and no other task may.
// Never lowered in priority: delay figures are measured in these runs. The scenarios skip themselves on a PC without
// %LOCALAPPDATA%\DraupneBench\hardware.properties (docs/hardware.example.properties).
def hardwareTask = { String taskName, String tagExpression, String what ->
    benchTask(taskName, tagExpression, what).configure {
        systemProperty 'bench.hardware', 'true'
    }
}
hardwareTask('benchHw', 'hw & !finding', 'Real hardware: the Windows app, sealed off, against the one real phone and its flight controller')
hardwareTask('benchHwPhone', 'hwphone & !finding', 'Real hardware: the real phone itself')
// <<< R4 --------------------------------------------------------------------------------------------------------------

tasks.register('benchReport', JavaExec) {
    group = 'bench'
    description = "Writes the report of the run in BENCH_ROOT: report/index.html"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.droiddrone.bench.BenchReport'
    args benchRootDir.path
}

// By hand, on the real internet: one tile from each of the map's servers, asked the way the app asks (docs/TESTING.md).
tasks.register('mapProbe', JavaExec) {
    group = 'verification'
    description = "Asks each map server for one tile as the app does and says what came"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.droiddrone.pc.map.MapServersProbe'
}

// By hand on a real drone, battery on, props off: the ESCs' firmware and beacon (-Pesc=silence switches the beacons off).
tasks.register('escProbe', JavaExec) {
    group = 'verification'
    description = "Reads the ESCs of the flight controller on USB (-Pesc=silence: beacon off; -Pport=COM9)"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.droiddrone.pc.setup.EscProbe'
    args((project.findProperty('esc') ?: 'read').toString(), (project.findProperty('port') ?: '').toString())
}

// ---- R1 BEGIN: the hardware rig's board tools (src/test/java/de/droiddrone/bench/hw) -------------------------------------
// By hand, on ONE real flight controller on USB, around tests that write to it. -Pport=COM9 names the port; without
// it the one flight controller found is taken (boardSafe: every one found).
//   gradlew boardSnapshot [-Pescs=true]                     reads everything, changes nothing; Betaflight restarts once
//                                                           (the CLI visit). Files it under %LOCALAPPDATA%\DraupneBench\board.
//   gradlew boardRestore -Psnapshot=<folder> [-Pescs=true]  puts a snapshot's settings back, all or nothing, and compares;
//                                                           -Preplay=always writes even when nothing differs;
//                                                           -Pcompare=only reads and compares and NEVER writes.
//   gradlew boardSafe                                       STOP to every motor, read back; fails unless disarmed and at rest.
// -Pescs=true also reads the ESCs' settings (battery in, props off): their start-up tones sound once, no motor turns.
def boardTool = { String taskName, String tool, String what, List<String> properties ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = what
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "de.droiddrone.bench.hw.${tool}"
        args(properties.collect { (project.findProperty(it) ?: '').toString() })
    }
}
boardTool('boardSnapshot', 'BoardSnapshot', "Reads and files the settings of the flight controller on USB (-Pport=COM9, -Pescs=true)", ['port', 'escs'])
boardTool('boardRestore', 'BoardRestore', "Puts a snapshot's settings back on the flight controller on USB (-Psnapshot=<folder>, -Pport=COM9, -Pescs=true, -Pcompare=only)", ['port', 'snapshot', 'escs', 'replay', 'compare'])
boardTool('boardSafe', 'BoardSafe', "Stops every motor of the flight controller on USB and says whether it is disarmed and at rest (-Pport=COM9)", ['port'])
// ---- R1 END ------------------------------------------------------------------------------------------------------------------

// ---------------------------------------------------------------------------------------------------------------------
// Release packaging (Windows):
//   gradlew packageApp        -> build/app-image/DRAUPNE Link/DRAUPNE Link.exe  (app + its own Java runtime)
//   gradlew releaseZip        -> build/release/DRAUPNE-Link-<version>-windows.zip  (portable, unzip and run)
//   gradlew packageInstaller  -> build/release/DRAUPNE-Link-Setup-<version>.exe  (needs WiX 3 on PATH; CI has it)

def jpackageTool = file("${System.getProperty('java.home')}/bin/jpackage.exe")
def iconFile = layout.buildDirectory.file('icon/draupne-link.ico').get().asFile
def appImageDir = layout.buildDirectory.dir('app-image').get().asFile
def releaseDir = layout.buildDirectory.dir('release').get().asFile

tasks.register('appIcon', JavaExec) {
    group = 'distribution'
    description = 'Draws the app icon into a .ico for the exe and installer'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.droiddrone.pc.Main'
    args 'write-icon', iconFile
    systemProperty 'java.awt.headless', 'true'
    outputs.file iconFile
}

tasks.register('packageApp', Exec) {
    group = 'distribution'
    description = 'Builds a self-contained Windows app image with jpackage'
    dependsOn installDist, appIcon
    doFirst { delete appImageDir }
    commandLine jpackageTool, '--type', 'app-image',
            '--name', 'DRAUPNE Link',
            '--app-version', version,
            '--vendor', 'draupne-link',
            '--icon', iconFile,
            '--input', layout.buildDirectory.dir('install/draupne-link/lib').get().asFile,
            '--main-jar', "draupne-link-${version}.jar",
            '--main-class', 'de.droiddrone.pc.Main',
            '--java-options', '-Dfile.encoding=UTF-8',
            '--java-options', '-Dsun.java2d.d3d=false',
            '--dest', appImageDir
    // the virtual fleet's starter next to the exe (zip and installer): "DRAUPNE Link.exe" fleet
    doLast {
        copy {
            from file('src/fleet/Virtual fleet.bat')
            into new File(appImageDir, 'DRAUPNE Link')
        }
    }
}

tasks.register('releaseZip', Zip) {
    group = 'distribution'
    description = 'Portable zip of the app image'
    dependsOn packageApp
    from(appImageDir)
    archiveFileName = "DRAUPNE-Link-${version}-windows.zip"
    destinationDirectory = releaseDir
}

tasks.register('packageInstaller', Exec) {
    group = 'distribution'
    description = 'Windows installer (all users; also does the PC setup as administrator: firewall, power plan, Tailscale)'
    dependsOn packageApp
    def staging = layout.buildDirectory.dir('installer').get().asFile
    doFirst { delete staging }
    commandLine jpackageTool, '--type', 'exe',
            '--app-image', new File(appImageDir, 'DRAUPNE Link'),
            '--name', 'DRAUPNE Link',
            '--app-version', version,
            '--vendor', 'draupne-link',
            '--description', 'Fly a Betaflight drone over a mobile network from Windows',
            '--icon', iconFile,
            // all users (Program Files), so the installer runs as administrator and can do the PC setup itself;
            // one Windows approval prompt covers it all (src/installer/main.wxs)
            // a normal setup wizard (without any dialog option the installer runs invisibly) - but no folder choice:
            // the installer runs the app as administrator from its folder, so it must be Program Files, which
            // ordinary users can't change
            '--win-shortcut-prompt',
            '--win-shortcut',
            '--win-menu',
            '--win-menu-group', 'DRAUPNE Link',
            // keep this UUID forever: it lets a newer installer replace an older install
            '--win-upgrade-uuid', '5d2f1d3e-6a0b-4c9e-9f53-2b7c1a8e4d61',
            '--resource-dir', file('src/installer'), // main.wxs: PC setup tasks, "Launch DRAUPNE Link" box
            '--dest', staging
    // main.wxs takes check-running.js from here (jpackage builds from a copy of the resource dir)
    environment 'DDPC_INSTALLER_DIR', file('src/installer').absolutePath
    doLast {
        copy {
            from(staging) { include '*.exe' }
            into releaseDir
            rename { "DRAUPNE-Link-Setup-${version}.exe" }
        }
    }
}
